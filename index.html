<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- Задание 1 -->
    <button id="btn">Сменить тему</button>

    <!-- Задание 2 -->
    <div class="textarea-container">
      <label for="message">Ваше сообщение</label>
      <textarea
        id="message"
        maxlength="50"
        placeholder="Начните вводить текст..."
      ></textarea>
      <div class="counter-box">
        Осталось символов: <span id="char-counter">50</span>
      </div>
    </div>

    <!-- Задание 3 -->
    <div class="like-wrapper">
      <button id="like"></button>
      <span class="plusik">0</span>
    </div>

    <!-- Задание 4 -->
    <div class="form-container">
      <div class="input-group">
        <label for="username">Имя</label>
        <input type="text" id="username" placeholder="Введите ваше имя" />
        <span class="status-text"></span>
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@mail.com" />
        <span class="status-text"></span>
      </div>
      <div class="input-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" placeholder="+7 (999) 999-99-99" />
        <span class="status-text"></span>
      </div>
    </div>

    <!-- Задние 5 -->
    <button id="open-modal-btn">Открыть окно</button>

    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-window">
        <h2>Поздравляем!</h2>
        <p>
          Вы отчислены!!!!!!
        </p>
        <button class="modal-action-btn" id="confirm-modal-btn">Отлично</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
